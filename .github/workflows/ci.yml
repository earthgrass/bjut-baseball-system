name: CI

# Phase R4（审计 #22）—— 项目此前**没有任何 CI**：一次「dict 字面量重复键」
# 这类 bug 能悄悄溜进来，正是因为没有自动检查。
#
# 本 workflow 只做三件事：
#   1. pytest（测试库在临时目录，生产库不参与 —— 见 tests/conftest.py）
#   2. node --test（前端纯逻辑单测）
#   3. ruff check（静态检查）
# 注意：CI **不会**碰 instance/ 里的任何文件，也不需要 SECRET_KEY 以外的密钥。

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 必须装 requirements-dev.txt：pytest 与 ruff 都在里面。
          #    requirements.txt 只有运行时依赖，不含 pytest → 曾经导致
          #    `pytest -q` 直接 "command not found"，两个 job 全红。
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Create the production DB (so the canary has something to guard)
        run: |
          mkdir -p instance
          python -c "import app"
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod

      - name: Unit & API tests (pytest)
        # ⚠️ 必须用 `python -m pytest`，不能用裸 `pytest`：
        #    裸 `pytest` 不把当前目录放进 sys.path，测试里的
        #    `from database import Player` 会 ModuleNotFoundError（10 个文件收集失败）。
        run: python -m pytest -q
        env:
          # 测试用临时库；生产库路径在测试里被 fail-fast 拦掉
          SECRET_KEY: ci-secret-key-not-used-in-prod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `node --test '<glob>'` 需要 node ≥ 21（glob 参数支持）。
          # 显式钉住版本，别依赖 runner 镜像的默认值。
          node-version: '22'

      - name: Front-end unit tests (node)
        # 注意：node 24 的 `node --test <目录>` 会把目录当成模块去 require
        # （MODULE_NOT_FOUND），必须用 glob。
        run: node --test 'tests/js/*.test.js'

  safety:
    # 「测试绝不碰生产库」这条不变量，值得单独一个 job 来守：
    # 任何测试如果写了 instance/baseball_players.db，这里立刻红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fingerprint the production DB before the tests
        # ⚠️ 不要从 recovery/ 复制：那个目录被 .gitignore 排除，
        #    干净的 CI checkout 里根本没有那个文件（首次 CI 运行就红了）。
        #    改成用仓库自己的代码生成一个生产库：app.py 在 import 时就调
        #    init_db(app)，建表 + 初始化守备位置。
        run: |
          mkdir -p instance
          python -c "import app"
          sha256sum instance/baseball_players.db | tee /tmp/sha_before.txt
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod

      - name: Run the tests
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod

      - name: The production DB must be byte-identical afterwards
        run: |
          sha256sum instance/baseball_players.db | tee /tmp/sha_after.txt
          diff /tmp/sha_before.txt /tmp/sha_after.txt \
            && echo "生产库未被改动 ✓" \
            || (echo "!!! 测试改了生产库 !!!"; exit 1)
