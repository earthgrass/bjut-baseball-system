{% extends "base.html" %}

{% block title %}PDF批量导入 - POWER ARENA{% endblock %}

{% block extra_head %}
<script src="{{ url_for('static', filename='js/tailwind.config.js') }}"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .log-box {
        height: 400px;
        overflow-y: auto;
        background: #1e1e1e;
        color: #d4d4d4;
        font-family: 'Consolas', monospace;
        font-size: 0.85rem;
        padding: 12px;
        border-radius: 6px;
        white-space: pre-wrap;
    }
    .log-box .log-ok { color: #4ec9b0; }
    .log-box .log-err { color: #f44747; }
    .log-box .log-skip { color: #dcdcaa; }
    .log-box .log-info { color: #569cd6; }
    .file-item { cursor: pointer; transition: all 0.15s; }
    .file-item:hover { background: rgba(230, 0, 0, 0.08); }
    .file-item.imported { opacity: .5; }
    .file-item.imported .status-icon { color: #28a745; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6">
    <h1 class="font-heading text-2xl sm:text-3xl text-white mb-6">
        PDF <span class="text-arena-red">批量导入</span>
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- 左侧：PDF文件列表 -->
        <div class="lg:col-span-5">
            <div class="mecha-card p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-heading text-lg text-white uppercase tracking-wider">PDF 文件列表</h2>
                    <span id="fileCount" class="text-xs text-gray-400">0 个文件</span>
                </div>
                <div id="fileList" class="space-y-1 max-h-[440px] overflow-y-auto">
                    <div class="text-center py-8 text-gray-500 text-sm">加载中...</div>
                </div>
                <div class="flex gap-2 mt-4 pt-4 border-t border-arena-red/10">
                    <button class="btn-outline px-4 py-2 text-sm font-semibold text-arena-red hover:text-white transition-colors" onclick="previewAll()">
                        预览全部
                    </button>
                    <button class="btn-primary px-4 py-2 text-sm font-semibold text-white" onclick="importAll(false)">
                        一键导入全部
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧：导入日志 -->
        <div class="lg:col-span-7">
            <div class="mecha-card p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-heading text-lg text-white uppercase tracking-wider">导入日志</h2>
                    <button class="text-xs text-gray-400 hover:text-arena-red transition-colors" onclick="clearLog()">清空</button>
                </div>
                <div class="log-box" id="logBox">等待操作...</div>
                <div class="flex items-center justify-between mt-4 pt-4 border-t border-arena-red/10">
                    <div class="flex gap-2">
                        <span class="badge bg-arena-red/20 text-arena-red px-2 py-1 text-xs font-semibold" id="badgeOk">成功: 0</span>
                        <span class="badge bg-yellow-500/20 text-yellow-300 px-2 py-1 text-xs font-semibold" id="badgeSkip">跳过: 0</span>
                        <span class="badge bg-red-700/30 text-red-400 px-2 py-1 text-xs font-semibold" id="badgeErr">错误: 0</span>
                    </div>
                    <div id="progressText" class="text-xs text-gray-500"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const logBox = document.getElementById('logBox');
let pdfFiles = [];
let counters = { ok: 0, skip: 0, err: 0 };

function log(msg, cls = '') {
    const div = document.createElement('div');
    if (cls) div.className = cls;
    div.textContent = msg;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function clearLog() {
    logBox.innerHTML = '';
    counters = { ok: 0, skip: 0, err: 0 };
    updateBadges();
}

function updateBadges() {
    document.getElementById('badgeOk').textContent = '成功: ' + counters.ok;
    document.getElementById('badgeSkip').textContent = '跳过: ' + counters.skip;
    document.getElementById('badgeErr').textContent = '错误: ' + counters.err;
}

async function loadFiles() {
    const res = await fetch('/api/pdf/files');
    pdfFiles = await res.json();
    document.getElementById('fileCount').textContent = pdfFiles.length + ' 个文件';
    const container = document.getElementById('fileList');
    container.innerHTML = '';
    pdfFiles.forEach((f) => {
        const div = document.createElement('div');
        div.className = 'file-item flex items-center justify-between px-3 py-2 border border-arena-red/10 rounded';
        div.innerHTML = `
            <div class="flex items-center gap-2 min-w-0">
                <span class="badge bg-arena-red/20 text-arena-red px-2 py-0.5 text-xs font-semibold flex-shrink-0">${f.year}</span>
                <span class="text-sm text-gray-300 truncate">${f.display_name}</span>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0">
                <span class="status-icon"></span>
                <small class="text-xs text-gray-500">${f.size}</small>
            </div>`;
        div.onclick = () => importOne(f.path, div);
        container.appendChild(div);
    });
}

async function previewAll() {
    clearLog();
    log('========== 预览模式 ==========', 'log-info');
    document.getElementById('progressText').textContent = '预览中...';
    for (let i = 0; i < pdfFiles.length; i++) {
        const f = pdfFiles[i];
        log(`\n[${i+1}/${pdfFiles.length}] ${f.filename}`, 'log-info');
        try {
            const res = await fetch('/api/pdf/parse/' + encodeURIComponent(f.path));
            const data = await res.json();
            if (data.error) {
                log('  错误: ' + data.error, 'log-err');
                counters.err++;
            } else {
                log(`  日期: ${data.game_date || '未知'}`, 'log-info');
                log(`  对手: ${data.opponent || '未知'}`, 'log-info');
                log(`  打击: ${data.my_team_batting?.length || 0} 条`, 'log-ok');
                data.my_team_batting?.forEach(b => {
                    log(`    ${b.name} AB=${b.at_bats} H=${b.hits} RBI=${b.rbi}`, 'log-ok');
                });
                log(`  投手: ${data.my_team_pitching?.length || 0} 条`, 'log-ok');
                data.my_team_pitching?.forEach(p => {
                    log(`    ${p.name} IP=${p.innings_pitched} ER=${p.earned_runs}`, 'log-ok');
                });
                counters.ok++;
            }
        } catch(e) {
            log('  请求失败: ' + e, 'log-err');
            counters.err++;
        }
        updateBadges();
    }
    document.getElementById('progressText').textContent = '预览完成';
}

async function importOne(path, el) {
    log('\n导入: ' + path, 'log-info');
    try {
        const res = await fetch('/api/pdf/import_one', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ filepath: path })
        });
        const data = await res.json();
        if (data.error) {
            log('  错误: ' + data.error, 'log-err');
            counters.err++;
        } else {
            log(`  成功: 打击 ${data.batting}, 投手 ${data.pitching}, 跳过 ${data.skipped}`, 'log-ok');
            if (data.new_players?.length) log('  新球员: ' + data.new_players.join(', '), 'log-info');
            counters.ok++;
            el?.classList.add('imported');
        }
    } catch(e) {
        log('  失败: ' + e, 'log-err');
        counters.err++;
    }
    updateBadges();
}

async function importAll(dryRun) {
    if (!dryRun && !confirm('确认要导入全部PDF数据到数据库吗？')) return;
    clearLog();
    log('========== 开始批量导入 ==========', 'log-info');
    document.getElementById('progressText').textContent = '导入中...';
    for (let i = 0; i < pdfFiles.length; i++) {
        const f = pdfFiles[i];
        log(`\n[${i+1}/${pdfFiles.length}] ${f.filename}`, 'log-info');
        await importOne(f.path, document.querySelectorAll('.file-item')[i]);
    }
    log('\n========== 导入完成 ==========', 'log-info');
    document.getElementById('progressText').textContent = '导入完成';
}

loadFiles();
</script>
{% endblock %}
