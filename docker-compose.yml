services:
  baseball-app:
    build: .
    container_name: baseball-team-management
    ports:
      - "5000:5000"
    volumes:
      # 持久化数据库
      - ./instance:/app/instance
      # 持久化数据文件（PDF等）
      - ./data:/app/data
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      # 必须设置强随机密钥，否则应用会拒绝启动：
      #   python -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY environment variable is required}
      # 首次启动时设为 1 以创建默认管理员账号，之后改为 0
      - INIT_DEFAULT_ADMIN=0
    restart: unless-stopped
